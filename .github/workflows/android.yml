name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rebuild_web:
        description: Rebuild the web bundle from flamekaizen/CALCI-W first
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: ${{ inputs.rebuild_web }}
        with:
          repository: flamekaizen/CALCI-W
          path: CALCI-W
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Rebuild web bundle
        if: ${{ inputs.rebuild_web }}
        run: CALCI_WEB_DIR=CALCI-W node scripts/sync-web.mjs
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Calci-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: calci-apk
          path: Calci-*.apk
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Calci-*.apk
          body: |
            Calci for Android. Download the .apk on your phone, open it and allow installing from this source when asked.
            This is a debug-signed build for direct installation (not from the Play Store).
